  <text x='480' y='305' fill='#94a3b8' font-size='10'>Generates 2 long-form SEO blog articles</text>

  <line x1='600' y1='319' x2='600' y2='343' stroke='#10b981' stroke-width='2'/>

  <rect x='460' y='345' width='280' height='54' rx='10' fill='#1e293b' stroke='#8b5cf6' stroke-width='1.5'/>
