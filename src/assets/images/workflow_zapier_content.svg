  <text x='480' y='127' fill='#fbbf24' font-size='11' font-weight='bold'>2. Filter by Zapier (Filter conditions)</text>
  <text x='480' y='145' fill='#94a3b8' font-size='10'>Only proceed if file is .mp3 / .mp4</text>

  <line x1='600' y1='159' x2='600' y2='183' stroke='#f59e0b' stroke-width='2'/>

  <rect x='460' y='185' width='280' height='54' rx='10' fill='#1e293b' stroke='#10b981' stroke-width='1.5'/>
  <text x='480' y='207' fill='#34d399' font-size='11' font-weight='bold'>3. AI by Zapier (Transcription)</text>
  <text x='480' y='225' fill='#94a3b8' font-size='10'>Extracts text transcript & timestamps</text>

  <line x1='600' y1='239' x2='600' y2='263' stroke='#10b981' stroke-width='2'/>

  <rect x='460' y='265' width='280' height='54' rx='10' fill='#1e293b' stroke='#10b981' stroke-width='1.5'/>
