<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 650' width='100%' height='100%' style='background:#0f172a; font-family: system-ui, sans-serif;'>
  <rect width='1200' height='650' fill='#0b0f19'/>
  <defs>
    <pattern id='grid' width='30' height='30' patternUnits='userSpaceOnUse'>
      <path d='M 30 0 L 0 0 0 30' fill='none' stroke='#1e293b' stroke-width='0.8'/>
    </pattern>
  </defs>
  <rect width='1200' height='650' fill='url(#grid)' />
  
  <rect x='40' y='25' width='440' height='38' rx='8' fill='#1e293b' stroke='#ff4f00' stroke-width='1.5'/>
  <text x='55' y='50' fill='#ffffff' font-size='14' font-weight='bold'>Zapier • AI-Powered Content Repurposing Workflow</text>

  <rect x='460' y='25' width='280' height='54' rx='10' fill='#1e293b' stroke='#3b82f6' stroke-width='1.5'/>
  <text x='480' y='47' fill='#60a5fa' font-size='11' font-weight='bold'>1. Google Drive (New File in Folder)</text>
  <text x='480' y='65' fill='#94a3b8' font-size='10'>Trigger: Monitors folder for audio/video</text>

