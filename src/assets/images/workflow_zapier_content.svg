  <text x='480' y='385' fill='#94a3b8' font-size='10'>Loops through array of generated posts</text>

  <line x1='600' y1='399' x2='600' y2='423' stroke='#8b5cf6' stroke-width='2'/>

  <rect x='460' y='425' width='280' height='54' rx='10' fill='#1e293b' stroke='#ff4f00' stroke-width='1.5'/>
  <text x='480' y='447' fill='#ff7a38' font-size='11' font-weight='bold'>6. Split Into Paths</text>
  <text x='480' y='465' fill='#94a3b8' font-size='10'>Conditional distribution by topic</text>

  <path d='M 600 479 L 600 505 L 320 505 L 320 530' fill='none' stroke='#ff4f00' stroke-width='2'/>
  <path d='M 600 479 L 600 505 L 880 505 L 880 530' fill='none' stroke='#ff4f00' stroke-width='2'/>

  <rect x='170' y='530' width='300' height='95' rx='10' fill='#1e293b' stroke='#3b82f6' stroke-width='1.5'/>
