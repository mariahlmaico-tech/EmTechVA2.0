<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 650' width='100%' height='100%' style='background:#0f172a; font-family: system-ui, sans-serif;'>
  <rect width='1200' height='650' fill='#0b0f19'/>
  <rect width='1200' height='650' fill='url(#grid)' />

  <rect x='40' y='25' width='520' height='38' rx='8' fill='#1e293b' stroke='#9333ea' stroke-width='1.5'/>
  <text x='55' y='50' fill='#ffffff' font-size='14' font-weight='bold'>Make.com • Export Account Transactions from Xero > Upload CSV to Asana</text>

  <!-- Flow sequence -->
  <g transform='translate(50, 180)'>
    <!-- Asana Node -->
    <circle cx='80' cy='120' r='42' fill='#f43f5e'/>
    <text x='80' y='125' fill='#ffffff' font-size='12' font-weight='bold' text-anchor='middle'>Asana</text>
    <text x='80' y='180' fill='#94a3b8' font-size='10' text-anchor='middle'>Watch Tasks</text>

    <line x1='122' y1='120' x2='198' y2='120' stroke='#a855f7' stroke-width='3' stroke-dasharray='4,4'/>

    <!-- Xero Node -->
    <circle cx='240' cy='120' r='42' fill='#0284c7'/>
    <text x='240' y='125' fill='#ffffff' font-size='12' font-weight='bold' text-anchor='middle'>Xero</text>
    <text x='240' y='180' fill='#94a3b8' font-size='10' text-anchor='middle'>Make API Call</text>

    <line x1='282' y1='120' x2='358' y2='120' stroke='#a855f7' stroke-width='3' stroke-dasharray='4,4'/>

    <!-- Router Node -->
    <circle cx='400' cy='120' r='42' fill='#84cc16'/>
    <text x='400' y='125' fill='#ffffff' font-size='12' font-weight='bold' text-anchor='middle'>Router</text>

    <!-- Branch 1 (Top) -->
    <path d='M 442 120 C 500 120, 500 20, 560 20' fill='none' stroke='#84cc16' stroke-width='3' stroke-dasharray='4,4'/>
    <circle cx='600' cy='20' r='38' fill='#84cc16'/>
    <text x='600' y='24' fill='#ffffff' font-size='11' font-weight='bold' text-anchor='middle'>Iterator</text>

    <line x1='638' y1='20' x2='712' y2='20' stroke='#a855f7' stroke-width='3' stroke-dasharray='4,4'/>
    <circle cx='750' cy='20' r='38' fill='#10b981'/>
    <text x='750' y='24' fill='#ffffff' font-size='11' font-weight='bold' text-anchor='middle'>Sheets</text>
    <text x='750' y='75' fill='#94a3b8' font-size='10' text-anchor='middle'>Add a Row</text>

    <!-- Branch 2 (Bottom) -->
    <path d='M 442 120 C 500 120, 500 220, 560 220' fill='none' stroke='#84cc16' stroke-width='3' stroke-dasharray='4,4'/>

    <circle cx='600' cy='220' r='38' fill='#a855f7'/>
    <text x='600' y='224' fill='#ffffff' font-size='11' font-weight='bold' text-anchor='middle'>Tools</text>

    <line x1='638' y1='220' x2='712' y2='220' stroke='#a855f7' stroke-width='3' stroke-dasharray='4,4'/>
    <circle cx='750' cy='220' r='38' fill='#10b981'/>
    <text x='750' y='224' fill='#ffffff' font-size='11' font-weight='bold' text-anchor='middle'>Sheets</text>
    <text x='750' y='275' fill='#94a3b8' font-size='10' text-anchor='middle'>Get Range Values</text>

    <line x1='788' y1='220' x2='862' y2='220' stroke='#a855f7' stroke-width='3' stroke-dasharray='4,4'/>
    <circle cx='900' cy='220' r='38' fill='#a855f7'/>
    <text x='900' y='224' fill='#ffffff' font-size='11' font-weight='bold' text-anchor='middle'>Tools</text>
    <text x='900' y='275' fill='#94a3b8' font-size='10' text-anchor='middle'>Text Aggregator</text>

    <line x1='938' y1='220' x2='1012' y2='220' stroke='#a855f7' stroke-width='3' stroke-dasharray='4,4'/>
    <circle cx='1050' cy='220' r='38' fill='#f43f5e'/>
    <text x='1050' y='224' fill='#ffffff' font-size='11' font-weight='bold' text-anchor='middle'>Asana</text>
    <text x='1050' y='275' fill='#94a3b8' font-size='10' text-anchor='middle'>Upload CSV</text>
  </g>
</svg>