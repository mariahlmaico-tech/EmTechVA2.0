<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 650' width='100%' height='100%' style='background:#0f172a; font-family: system-ui, sans-serif;'>
  <rect width='1200' height='650' fill='#0b0f19'/>
  <rect width='1200' height='650' fill='url(#grid)' />

  <rect x='40' y='25' width='440' height='38' rx='8' fill='#1e293b' stroke='#9333ea' stroke-width='1.5'/>
  <text x='55' y='50' fill='#ffffff' font-size='14' font-weight='bold'>Make.com • Integration Gmail & AI Document Processing</text>

  <g transform='translate(40, 240)'>
    <!-- Gmail 1 -->
    <circle cx='70' cy='100' r='40' fill='#ef4444'/>
    <text x='70' y='105' fill='#ffffff' font-size='11' font-weight='bold' text-anchor='middle'>Gmail</text>
    <text x='70' y='160' fill='#94a3b8' font-size='10' text-anchor='middle'>Watch emails</text>

    <line x1='110' y1='100' x2='180' y2='100' stroke='#a855f7' stroke-width='3' stroke-dasharray='4,4'/>

    <!-- Gmail 2 -->
    <circle cx='220' cy='100' r='40' fill='#ef4444'/>
    <text x='220' y='105' fill='#ffffff' font-size='11' font-weight='bold' text-anchor='middle'>Gmail</text>
    <text x='220' y='160' fill='#94a3b8' font-size='10' text-anchor='middle'>List Attachments</text>

    <line x1='260' y1='100' x2='330' y2='100' stroke='#a855f7' stroke-width='3' stroke-dasharray='4,4'/>

    <!-- AI Upload -->
    <circle cx='370' cy='100' r='40' fill='#3b82f6'/>
    <text x='370' y='105' fill='#ffffff' font-size='11' font-weight='bold' text-anchor='middle'>AI / OpenAI</text>
    <text x='370' y='160' fill='#94a3b8' font-size='10' text-anchor='middle'>Upload & Analyze</text>

    <line x1='410' y1='100' x2='480' y2='100' stroke='#a855f7' stroke-width='3' stroke-dasharray='4,4'/>

    <!-- AI Generate Filename -->
    <circle cx='520' cy='100' r='40' fill='#3b82f6'/>
    <text x='520' y='105' fill='#ffffff' font-size='11' font-weight='bold' text-anchor='middle'>AI Model</text>
    <text x='520' y='160' fill='#94a3b8' font-size='10' text-anchor='middle'>Generate Filename</text>

    <line x1='560' y1='100' x2='630' y2='100' stroke='#a855f7' stroke-width='3' stroke-dasharray='4,4'/>

    <!-- Google Drive -->
    <circle cx='670' cy='100' r='40' fill='#eab308'/>
    <text x='670' y='105' fill='#ffffff' font-size='11' font-weight='bold' text-anchor='middle'>Drive</text>
    <text x='670' y='160' fill='#94a3b8' font-size='10' text-anchor='middle'>Upload Attachment</text>

    <line x1='710' y1='100' x2='780' y2='100' stroke='#a855f7' stroke-width='3' stroke-dasharray='4,4'/>

    <!-- Google Sheets -->
    <circle cx='820' cy='100' r='40' fill='#10b981'/>
    <text x='820' y='105' fill='#ffffff' font-size='11' font-weight='bold' text-anchor='middle'>Sheets</text>
    <text x='820' y='160' fill='#94a3b8' font-size='10' text-anchor='middle'>Saved Log Row</text>

    <line x1='860' y1='100' x2='930' y2='100' stroke='#a855f7' stroke-width='3' stroke-dasharray='4,4'/>

    <!-- Gmail Notification -->
    <circle cx='970' cy='100' r='40' fill='#ef4444'/>
    <text x='970' y='105' fill='#ffffff' font-size='11' font-weight='bold' text-anchor='middle'>Gmail</text>
    <text x='970' y='160' fill='#94a3b8' font-size='10' text-anchor='middle'>Email Alert</text>
  </g>
</svg>